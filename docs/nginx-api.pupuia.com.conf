# Install this as /etc/nginx/sites-available/api.pupuia.com on the VPS.
# First create the HTTP server block and issue the certificate with Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name api.pupuia.com;

    location / {
        return 404;
    }

    location = /gpt-api/openapi.json {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /gpt-api/v1/ {
        limit_req zone=gpt_odoo_api burst=10 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

# Add this once in /etc/nginx/conf.d/gpt-odoo-rate-limit.conf (http scope):
# limit_req_zone $binary_remote_addr zone=gpt_odoo_api:10m rate=30r/m;
